<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congiuntura Live</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script>
        // Apply saved theme before render to avoid flash
        (function () {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        body { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; }
        header h1 { margin-bottom: 0; }
        header .subtitle { font-size: 0.9rem; opacity: 0.7; }
        nav { display: flex; gap: 0.25rem; align-items: center; }
        nav a {
            text-decoration: none; padding: 0.35rem 0.85rem;
            border-radius: 20px; font-size: 0.9rem; font-weight: 500;
            border: 1px solid var(--pico-muted-border-color, #ced4da);
            color: inherit; transition: background 0.15s, border-color 0.15s;
        }
        nav a:hover { background: var(--pico-secondary-background, #e9ecef); }
        nav a.active {
            background: var(--pico-primary, #0d6efd); color: #fff;
            border-color: var(--pico-primary, #0d6efd);
        }

        .search-bar {
            display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap;
            padding: 1rem; border-radius: 8px; margin-bottom: 1rem;
            border: 1px solid var(--pico-muted-border-color, #ced4da);
        }
        .search-bar label { margin-bottom: 0; flex: 1; min-width: 140px; }
        .search-bar select, .search-bar input { margin-bottom: 0; }
        .filter-hint { font-size: 0.75rem; opacity: 0.6; margin-bottom: 0.5rem; }
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.8rem; }

        .reprocess-btn { margin-bottom: 0; white-space: nowrap; }
        .reprocess-btn:disabled { opacity: 0.5; cursor: wait; }

        .stats {
            font-size: 0.85rem; opacity: 0.7; margin-bottom: 0.5rem;
            display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
        }
        .stats-inline { display: inline-flex; gap: 1rem; align-items: center; }
        #retrieved-count { font-weight: 600; }
        .spinner { font-weight: 600; color: var(--pico-primary, #0d6efd); }
        .flash { padding: 0.3rem 0.6rem; background: #e8f5e9; border-radius: 4px; font-size: 0.85rem; }

        .badge {
            display: inline-block; padding: 0.15rem 0.5rem;
            border-radius: 4px; font-size: 0.8rem; font-weight: 600;
            color: #fff; white-space: nowrap; background: var(--pico-primary, #0d6efd);
        }
        .badge.eurostat { background: #0064c8; }
        .badge.istat { background: #005e4a; }
        .badge.ine { background: #c8102e; }
        .badge.insee { background: #000091; }
        .badge.destatis { background: #444; }
        .badge.cso { background: #008080; }
        .empty { text-align: center; opacity: 0.5; padding: 2rem; }

        /* ── Processed cards ── */
        .card {
            border: 1px solid var(--pico-muted-border-color, #ced4da); border-radius: 8px;
            padding: 1rem; margin-bottom: 1rem;
        }
        .card-header { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .card-header .topic { font-weight: 600; }
        .card-header .country { opacity: 0.7; font-size: 0.9rem; }
        .card-header .sentiment { font-size: 0.8rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; }
        .sentiment-positive { background: #d4edda; color: #155724; }
        .sentiment-negative { background: #f8d7da; color: #721c24; }
        .sentiment-neutral  { background: #e2e3e5; color: #383d41; }
        .card h3 { margin: 0.3rem 0; font-size: 1.05rem; }
        .card h3 a { text-decoration: none; }
        .title-en { font-size: 0.9rem; font-style: italic; opacity: 0.85; margin: 0.15rem 0 0.3rem; }
        .summary-en { font-size: 0.95rem; margin: 0.3rem 0; }
        .key-figures { font-size: 0.85rem; opacity: 0.7; margin: 0.3rem 0; font-family: monospace; }
        .card-footer { display: flex; gap: 1rem; font-size: 0.8rem; opacity: 0.7; margin-top: 0.5rem; }
        .card-footer .model { margin-left: auto; }

        /* ── Raw table ── */
        #results table { width: 100%; }
        #results td { vertical-align: top; padding: 0.75rem 0.5rem; }
        #results tr { border-bottom: 1px solid var(--pico-muted-border-color, #ced4da); }
        .feed-label { font-size: 0.75rem; opacity: 0.7; margin-top: 0.2rem; }
        .summary { font-size: 0.85rem; opacity: 0.7; margin-top: 0.3rem; }

        /* ── Release calendar ── */
        .cal-card {
            display: flex; align-items: baseline; gap: 1rem;
            padding: 0.7rem 1rem; margin-bottom: 0.45rem;
            border-radius: 6px; border-left: 3px solid var(--pico-muted-border-color, #ccc);
            background: var(--pico-card-background-color, #fff);
            font-size: 1.02em;
        }
        .cal-ff  { border-left-color: #1565c0; background: color-mix(in srgb, #1565c0 7%, var(--pico-card-background-color, #fff)); }
        .cal-nso { border-left-color: #2e7d32; }
        .cal-past { opacity: 0.55; }
        .cal-date { min-width: 130px; font-size: 0.95em; color: var(--pico-muted-color, #555); white-space: nowrap; }
        .cal-source { min-width: 100px; font-size: 0.9em; font-weight: 600; }
        .src-nso { color: #2e7d32; }
        .src-ff  { color: #1565c0; }
        .cal-title { flex-grow: 1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; }
        .cal-ref { color: var(--pico-muted-color, #888); }
        .impact-badge {
            font-size: 0.7em; padding: 0.1rem 0.35rem; border-radius: 3px;
            text-transform: uppercase; font-weight: 600;
        }
        .impact-badge.high   { background: #ffebee; color: #c62828; }
        .impact-badge.medium { background: #fff3e0; color: #ef6c00; }
        .impact-badge.low    { background: color-mix(in srgb, #757575 15%, transparent); color: #757575; }
        .ff-values {
            margin-left: auto;
            display: inline-grid; grid-template-columns: repeat(3, minmax(5.5rem, auto));
            gap: 0 0.9rem; font-family: monospace; font-size: 0.82em;
            background: color-mix(in srgb, #1565c0 12%, transparent);
            padding: 0.25rem 0.7rem; border-radius: 4px;
        }
        .ff-actual { font-weight: 700; color: #0d47a1; }
        [data-theme="dark"] .ff-actual { color: #90caf9; }

        footer { text-align: center; margin-top: 3rem; opacity: 0.5; font-size: 0.8rem; }

        /* ── Last-update indicator ── */
        .last-update {
            display: flex; align-items: baseline; gap: 0.4rem;
            font-size: 0.8rem; opacity: 0.75; margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .lu-label { font-weight: 600; }
        .lu-time { font-family: monospace; }
        .lu-status.ok { color: #2e7d32; font-weight: 700; }
        .lu-status.warn { color: #ef6c00; font-weight: 700; }
        .lu-details { opacity: 0.7; font-size: 0.9em; }
        .last-update.ws-live .lu-time { color: var(--pico-primary, #0d6efd); }

        /* Theme toggle */
        .theme-toggle {
            background: none; border: 1px solid var(--pico-muted-border-color, #ced4da);
            border-radius: 8px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 1.1rem;
            line-height: 1; opacity: 0.8;
        }
        .theme-toggle:hover { opacity: 1; }
    </style>
</head>
<body hx-boost>
    <header>
        <div>
            <h1>📊 Congiuntura Live</h1>
            <div class="subtitle">European statistics press releases — Eurostat · Istat · INE · INSEE · Destatis · CSO</div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <nav>
                <a href="/" class="{% block nav_main %}{% endblock %}">Home</a>
                <a href="/calendar" class="{% block nav_calendar %}{% endblock %}">Calendar</a>
                <a href="/raw" class="{% block nav_raw %}{% endblock %}">Raw feeds</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light">🌓</button>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>Congiuntura Live · <a href="https://github.com/paluigi/congiuntura-live">GitHub</a></p>
    </footer>

    <!-- htmx (vendored) -->
    <script src="/static/htmx.min.js"></script>
    <script src="/static/htmx-ext-ws.min.js"></script>
    <script>
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // Live last-update indicators use the htmx ws extension
        // (ws-connect on each indicator wrapper; server pushes HTML
        // fragments swapped by element id — see templates/_last_update.html)
    </script>
</body>
</html>
