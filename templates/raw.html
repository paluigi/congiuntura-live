{% extends "base.html" %}
{% block nav_raw %}active{% endblock %}
{% block content %}

{% set which = "press" %}
{% include "_last_update.html" %}

<form id="filter-form" class="search-bar"
      hx-get="/search-raw"
      hx-trigger="submit"
      hx-target="#results"
      hx-include="this"
      hx-swap="innerHTML">
    <label>
        Publisher
        <select name="publisher"
                hx-get="/search-raw"
                hx-trigger="change"
                hx-target="#results"
                hx-include="closest form"
                hx-swap="innerHTML">
            <option value="all">All agencies</option>
            {% for slug, name in publishers %}
            <option value="{{ slug }}">{{ name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>
        From
        <input type="date" name="date_from"
               hx-get="/search-raw"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>

    <label>
        To
        <input type="date" name="date_to"
               hx-get="/search-raw"
               hx-trigger="change"
               hx-target="#results"
               hx-include="closest form"
               hx-swap="innerHTML">
    </label>

    <button type="button" class="btn-sm outline"
            style="margin-bottom: 0;"
            onclick="document.querySelectorAll('#filter-form select, #filter-form input').forEach(function(el) { if (el.tagName==='SELECT') el.selectedIndex=0; else el.value=''; }); htmx.trigger('#filter-form select[name=publisher]', 'change');">
        ✕ Clear filters
    </button>
</form>

<div class="stats">
    <span>Feeds: {{ total }} raw — <span id="retrieved-count">{{ total }} retrieved</span></span>
</div>

<div id="results" hx-get="/search-raw" hx-trigger="load" hx-swap="innerHTML">
    <p class="empty">Loading…</p>
</div>

{% endblock %}
