services:
  # ─── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application ───────────────────────────────────────────
  app:
    image: paluigi/congiuntura-live:0.8.0
    container_name: congiuntura-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DATABASE=congiuntura
      # Read-only Mongo user for the MCP agent endpoint (/mcp).
      # Create with: scripts/create_agent_ro_user.js (falls back to MONGODB_URL when unset)
      - AGENT_MONGODB_URL=${AGENT_MONGODB_URL:-}
      # LLM API keys — set these for your deployment
      - LLM7_API_KEY=${LLM7_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Optional HTTP(S) proxy for ForexFactory calendar scraping
      - FF_PROXY_URL=${FF_PROXY_URL:-}
    volumes:
      # Mount config and templates so changes don't require a rebuild
      - ./config:/app/config:ro
      - ./templates:/app/templates:ro
    depends_on:
      mongo:
        condition: service_healthy

  # ─── congiuntura-agent (static bundle, optional) ───────────
  # Enabled by the `agent` profile (COMPOSE_PROFILES=agent in .env, or
  # `docker compose --profile agent up -d`). Joins the network the reverse
  # proxy (Nginx Proxy Manager) lives on — set NPM_NETWORK in .env to its
  # name. Publishes no port; reach it as http://congiuntura-agent:80.
  congiuntura-agent:
    image: paluigi/congiuntura-agent:0.1.0
    container_name: congiuntura-agent
    restart: unless-stopped
    profiles:
      - agent
    networks:
      - proxy

volumes:
  mongo_data:

networks:
  # Pre-existing network shared with the reverse proxy (only used by the
  # `agent` profile, so a plain `docker compose up -d` works without it).
  proxy:
    external: true
    name: ${NPM_NETWORK:-proxy}
